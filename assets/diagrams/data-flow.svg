<svg viewBox="0 0 960 640" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0e14"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e3050"/>
      <stop offset="1" stop-color="#152540"/>
    </linearGradient>
    <linearGradient id="gNative" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a2a4a"/>
      <stop offset="1" stop-color="#081e38"/>
    </linearGradient>
    <linearGradient id="gHydra" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e1050"/>
      <stop offset="1" stop-color="#150c3a"/>
    </linearGradient>
    <linearGradient id="gTimeline" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a3520"/>
      <stop offset="1" stop-color="#072818"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4f9cff"/>
    </marker>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a78bfa"/>
    </marker>
    <style>
      .t1 { font-family: Inter, system-ui, sans-serif; fill: #f0f4ff; font-size: 15px; font-weight: 700; }
      .t2 { font-family: Inter, system-ui, sans-serif; fill: #38bdf8; font-size: 13px; font-weight: 700; }
      .t3 { font-family: Inter, system-ui, sans-serif; fill: #7dd3fc; font-size: 12px; }
      .t4 { font-family: Inter, system-ui, sans-serif; fill: #7d8aa3; font-size: 12px; }
      .t5 { font-family: Inter, system-ui, sans-serif; fill: #4ade80; font-size: 13px; font-weight: 700; }
      .t6 { font-family: Inter, system-ui, sans-serif; fill: #c4b5fd; font-size: 12px; }
      .t7 { font-family: Inter, system-ui, sans-serif; fill: #6b7280; font-size: 12px; font-weight: 600; }
    </style>
  </defs>

  <rect width="960" height="640" fill="url(#bg)" rx="16"/>

  <!-- Title bar -->
  <rect x="30" y="20" width="900" height="30" rx="8" fill="#111827" stroke="#1f2937" stroke-width="1"/>
  <circle cx="50" cy="35" r="6" fill="#ef4444"/>
  <circle cx="70" cy="35" r="6" fill="#eab308"/>
  <circle cx="90" cy="35" r="6" fill="#22c55e"/>
  <text x="480" y="40" text-anchor="middle" class="t7">DATA FLOW — REQUEST TO RESPONSE</text>

  <g font-family="Inter, system-ui, sans-serif">
    <g transform="translate(330,68)">
      <rect width="300" height="48" rx="10" fill="url(#box)" stroke="#4f9cff" stroke-width="2"/>
      <text x="150" y="30" text-anchor="middle" class="t1">User Input</text>
    </g>

    <g transform="translate(210,140)">
      <rect width="540" height="48" rx="10" fill="url(#box)" stroke="#4f9cff" stroke-width="2"/>
      <text x="270" y="30" text-anchor="middle" class="t1">ComposerView → PromptEditor → ProviderSession</text>
    </g>

    <g transform="translate(210,218)">
      <rect width="540" height="52" rx="10" fill="url(#box)" stroke="#4f9cff" stroke-width="2"/>
      <text x="270" y="28" text-anchor="middle" class="t1">ThreadRuntime → ProviderAdapter</text>
      <text x="270" y="48" text-anchor="middle" class="t3">Claude · Codex · Cursor · OpenCode · Grok · …</text>
    </g>

    <line x1="300" y1="270" x2="300" y2="302" stroke="#4f9cff" stroke-width="1.5" marker-end="url(#arr)"/>
    <line x1="660" y1="270" x2="660" y2="302" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arr2)"/>

    <!-- Native Agent Tools -->
    <g transform="translate(90,302)">
      <rect width="420" height="180" rx="12" fill="url(#gNative)" stroke="#38bdf8" stroke-width="2"/>
      <rect x="0" y="0" width="7" height="180" rx="3" fill="#38bdf8"/>
      <text x="20" y="28" class="t2">NATIVE AGENT TOOLS</text>
      <text x="20" y="58" class="t1">Claude Agent · Codex spawn_agent</text>
      <text x="20" y="84" class="t1">Copilot task · ACP subagents</text>
      <text x="20" y="116" class="t4">↓ emits streaming events</text>
      <text x="20" y="144" class="t3">ProviderEvent.messageDelta</text>
      <text x="20" y="168" class="t3">ProviderEvent.toolStarted</text>
      <text x="20" y="190" class="t3">ProviderEvent.agentFinished</text>
    </g>

    <!-- Hydra Delegation -->
    <g transform="translate(490,302)">
      <rect width="420" height="180" rx="12" fill="url(#gHydra)" stroke="#a78bfa" stroke-width="2"/>
      <rect x="0" y="0" width="7" height="180" rx="3" fill="#a78bfa"/>
      <text x="20" y="28" fill="#a78bfa" font-family="Inter, system-ui, sans-serif" font-size="13px" font-weight="700">HYDRA DELEGATION</text>
      <text x="20" y="58" class="t1">HydraDelegationStreamParser</text>
      <text x="20" y="84" class="t1">Swarm-run heads</text>
      <text x="20" y="108" class="t4">(parallel worktrees, isolated git)</text>
      <text x="20" y="140" class="t6">HydraMergeRecord</text>
      <text x="20" y="164" class="t4">→ patch → checkout</text>
    </g>

    <line x1="180" y1="482" x2="300" y2="528" stroke="#4f9cff" stroke-width="1.5" marker-end="url(#arr)"/>
    <line x1="660" y1="482" x2="660" y2="528" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arr2)"/>

    <!-- Timeline -->
    <g transform="translate(210,528)">
      <rect width="540" height="68" rx="12" fill="url(#gTimeline)" stroke="#4ade80" stroke-width="2"/>
      <rect x="0" y="0" width="7" height="68" rx="3" fill="#4ade80"/>
      <text x="270" y="30" text-anchor="middle" class="t5">TIMELINE ROW · LIVE STREAMING</text>
      <text x="270" y="52" text-anchor="middle" class="t1">Rendered into the chat timeline as it arrives.</text>
    </g>
  </g>
</svg>
